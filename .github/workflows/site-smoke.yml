name: site-smoke

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "tests/site-smoke/**"
      - ".github/workflows/site-smoke.yml"
  pull_request:
    paths:
      - "docs/**"
      - "tests/site-smoke/**"
      - ".github/workflows/site-smoke.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/site-smoke
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: tests/site-smoke/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: tests/site-smoke/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: site-smoke-report
          path: |
            tests/site-smoke/playwright-report
            tests/site-smoke/test-results
