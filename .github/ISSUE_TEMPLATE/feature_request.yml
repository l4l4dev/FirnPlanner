name: Feature request or improvement
description: Suggest a feature or an improvement for FirnPlanner
title: "[Request] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the suggestion. Please fill in the fields below.

  - type: textarea
    id: what
    attributes:
      label: What you would like
      description: Describe the feature or improvement you want, as specifically as you can.
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Background and reason
      description: Tell us why you want it and in what situation you run into trouble.
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional information
      description: Any images or links that might help (optional).
    validations:
      required: false
