name: Bug report
description: Report a bug in FirnPlanner
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Please fill in the fields below as far as you can.

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Tell us step by step what you did to make it happen.
      placeholder: |
        1. Open X
        2. Do Y
        3. Z happens
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Tell us what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Tell us what actually happened. If there is an error message, paste it here.
    validations:
      required: true

  - type: input
    id: macos-version
    attributes:
      label: macOS version
      placeholder: e.g. macOS 15.1 (Sequoia)
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: FirnPlanner version
      description: You can find it under FirnPlanner > About FirnPlanner in the menu bar.
      placeholder: e.g. 0.3.0
    validations:
      required: true

  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: A screenshot helps if you have one (optional). Drag and drop an image into this field to attach it.
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional information
      description: Anything else you would like us to know.
    validations:
      required: false
